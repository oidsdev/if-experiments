<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>$5 Flip Challenge</title>
  <meta name="description" content="Pot and flip history for the $5 Flip Challenge.">
  <link rel="canonical" href="https://ignitionfoundry.com/flip">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%231a1a1a'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23fff'/%3E%3C/svg%3E">
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 40rem;
      margin: 4rem auto;
      padding: 0 1rem;
      line-height: 1.6;
      color: #1a1a1a;
      background: #fff;
    }
    h1 { font-size: 1.6rem; margin: 0 0 0.35rem; }
    h2 { font-size: 1.05rem; margin: 2.25rem 0 0.6rem; }
    .brand { margin: 0 0 1.25rem; font-size: 0.9rem; }
    .lead { margin: 0; }
    .label {
      margin: 1.75rem 0 0;
      font-size: 0.8rem;
      font-weight: 500;
      color: #666;
    }
    .pot {
      margin: 0.1rem 0 0;
      font-size: 2.75rem;
      font-weight: 600;
      letter-spacing: -0.03em;
      line-height: 1.15;
      font-variant-numeric: tabular-nums;
    }
    .pnl { margin: 0.2rem 0 0; }
    .note { margin: 0.35rem 0 0; color: #666; font-size: 0.9rem; }
    .empty { margin: 0; color: #666; }
    .table-wrap { overflow-x: auto; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-variant-numeric: tabular-nums;
    }
    caption.sr {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    th, td {
      text-align: left;
      padding: 0.45rem 0.6rem 0.45rem 0;
      border-bottom: 1px solid #e6e6e6;
      vertical-align: baseline;
    }
    th { font-weight: 500; color: #666; font-size: 0.85rem; }
    td.num, th.num { text-align: right; white-space: nowrap; }
    th:last-child, td:last-child { padding-right: 0; }
    footer { margin-top: 3rem; font-size: 0.85rem; color: #666; }
  </style>
</head>
<body>
  <p class="brand"><a href="https://ignitionfoundry.com/">Orbital Desk</a></p>
  <h1>$5 Flip Challenge</h1>
  <p class="lead">Buy something. Sell it. The pot is what's left.</p>

  <main id="app" aria-busy="true">
    <p class="label">Pot</p>
    <p class="pot" id="pot"></p>
    <p class="pnl" id="pnl"></p>
    <p class="note" id="note" hidden></p>
    <h2 id="flips-heading">Flips</h2>
    <div id="history"></div>
  </main>

  <footer>© 2026 Orbital Desk LLC</footer>
  <noscript>This page reads flips.json in the browser. Turn JavaScript on to see the pot.</noscript>
  <script src="pot.js"></script>
</body>
</html>
